spring:
  application:
    name: shipment-tracking-service

  datasource:
    url: jdbc:h2:mem:shipmentdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  h2:
    console:
      enabled: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: WARN
    liquibase: INFO

# Phase 2 — partner dedupe strategy (docs/ANALYSIS.md §6.1)
shipment:
  partners:
    dhl:
      dedupe-strategy: event-id
    acme:
      dedupe-strategy: natural-key
