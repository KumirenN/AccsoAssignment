databaseChangeLog:
  - changeSet:
      id: 004-natural-key-partial-index
      author: shipment
      comment: >
        Phase 2 schema cleanup: drop uk_partner_natural_key (a full UK blocks DUPLICATE audit
        rows that repeat the same natural key). H2 has no partial unique indexes; acme dedupe
        stays in application code. shipment_event.id is unchanged — BIGINT auto-increment PK
        from changelog 002 (JPA GenerationType.IDENTITY); this file does not alter the id column.
      changes:
        - sql:
            sql: ALTER TABLE shipment_event DROP CONSTRAINT IF EXISTS uk_partner_natural_key
        - sql:
            sql: DROP INDEX IF EXISTS uk_partner_natural_key
