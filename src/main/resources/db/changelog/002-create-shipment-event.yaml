databaseChangeLog:
  - changeSet:
      id: 002-create-shipment-event
      author: shipment
      changes:
        - createTable:
            tableName: shipment_event
            remarks: Append-only ingest audit log (Phase 1 — event_id NOT NULL)
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: Surrogate PK — BIGINT IDENTITY (auto-increment); application never assigns id
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shipment_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: partner
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: received_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: location
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: disposition
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: state_changed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: raw_payload
                  type: clob
                  constraints:
                    nullable: false
              - column:
                  name: payload_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: ingested_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: shipment_event
            columnNames: partner, event_id
            constraintName: uk_partner_event_id
        - createIndex:
            tableName: shipment_event
            indexName: idx_event_shipment_timeline
            columns:
              - column:
                  name: shipment_id
              - column:
                  name: occurred_at
              - column:
                  name: received_at
              - column:
                  name: id
